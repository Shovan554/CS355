<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Breed Viewer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>Dog Breed Viewer</h1>
        <div class="search-container">
            <input type="text" id="breedInput" list="breeds" placeholder="Type a dog breed...">
            <datalist id="breeds"></datalist>
            <button id="showImagesBtn">Show Images</button>
        </div>
        <div id="statusMessage"></div>
        <div id="imageContainer"></div>
    </div>
    <script>
        const breedInput = document.getElementById('breedInput');
        const breedsDatalist = document.getElementById('breeds');
        const showImagesBtn = document.getElementById('showImagesBtn');
        const statusMessage = document.getElementById('statusMessage');
        const imageContainer = document.getElementById('imageContainer');

        let intervalId = null;
        let allBreeds = [];

        //fetching all breeds
        async function init() {
            try {
                const response = await fetch('/breeds');
                allBreeds = await response.json();
                
                allBreeds.sort().forEach(breed => {
                    const option = document.createElement('option');
                    option.value = breed;
                    breedsDatalist.appendChild(option);
                });
            } catch (error) {
                console.error('Error fetching breeds:', error);
            }
        }

        async function showRandomImage(breed) {
            try {
                const response = await fetch(`/image/${breed}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    statusMessage.textContent = '';
                    imageContainer.innerHTML = `<img src="${data.message}" alt="${breed}">`;
                } else {
                    handleError();
                }
            } catch (error) {
                handleError();
            }
        }

        function handleError() {
            statusMessage.textContent = 'No such breed';
            imageContainer.innerHTML = '';
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        showImagesBtn.addEventListener('click', () => {
            const breed = breedInput.value.toLowerCase().trim();
            
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            if (allBreeds.includes(breed)) {
                showRandomImage(breed);
                intervalId = setInterval(() => showRandomImage(breed), 5000);
            } else {
                handleError();
            }
        });

        init();
    </script>
</body>
</html>
